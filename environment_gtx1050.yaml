name: msi-predictor-gtx1050

# Linux + NVIDIA GeForce GTX 1050 (Pascal, compute capability 6.1)
# Local predictor development / smoke-test environment.
# PyTorch 2.12.x: use CUDA 12.6 wheels for Pascal GPUs.

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip>=24

  # Skeleton / numerical stack
  - numpy>=1.26,<3
  - scipy>=1.12,<2
  - pandas>=2.1,<3
  - scikit-learn>=1.4,<2
  - matplotlib>=3.8,<4
  - pyyaml>=6,<7

  # Skeleton imports / hardware interface modules.
  # These allow imports on Linux; actual I2C/serial hardware may still be absent.
  - pyserial>=3.5,<4
  - smbus2>=0.4,<1

  # Development conveniences
  - ipykernel>=6.29,<7
  - jupyterlab>=4,<5

  # Install the Linux/Windows platform-appropriate CUDA 12.6 PyTorch wheel.
  # No hard-coded win_amd64 wheel URL.
  - pip:
      - --index-url https://download.pytorch.org/whl/cu126
      - torch==2.12.1